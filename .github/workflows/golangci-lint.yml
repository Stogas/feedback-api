name: golangci-lint
on: workflow_call

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go 1.25.2
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.2"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
