name: Deploy to production-eu

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose how to deploy'
        required: true
        type: choice
        options: [bump, use-latest]
        default: bump
      bump:
        description: 'Version bump level (only used when mode=bump)'
        required: false
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: deploy-production-eu
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  calculate-version:
    name: Determine version
    runs-on: self-hosted
    outputs:
      version: ${{ steps.setver.outputs.version }}
      should_build: ${{ steps.setver.outputs.should_build }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get semver info
        id: semver
        uses: rickstaa/action-get-semver@v1
        with:
          bump_level: ${{ github.event.inputs.bump }}

      - name: Set outputs
        id: setver
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.mode }}" == "bump" ]]; then
            echo "version=${{ steps.semver.outputs.next_version }}" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.semver.outputs.current_version }}" >> $GITHUB_OUTPUT
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: calculate-version
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push
        if: ${{ needs.calculate-version.outputs.should_build == 'true' }}
        uses: meedio/actions/docker-build@v2
        with:
          app-name: feedback-api
          version: '${{ needs.calculate-version.outputs.version }}'

  deploy:
    needs: [calculate-version, build]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        uses: meedio/actions/deploy@v2
        with:
          environment: production-eu
          app-name: feedback-api
          version: '${{ needs.calculate-version.outputs.version }}'
          file-path: 'feedback-api/2-feedback-api.yaml'
          kubectl-namespace: feedback-api
          kubectl-object: deployment/feedback-api

  tag:
    name: Create & Push Git Tag
    needs: [deploy, calculate-version]
    if: ${{ needs.calculate-version.outputs.should_build == 'true' }}
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout full history & auth
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          TAG=${{ needs.calculate-version.outputs.version }}
          git tag "$TAG"
          git push origin "$TAG"
